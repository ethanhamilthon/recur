name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${want}"
            exit 1
          fi

      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out="dist/recur_${os}_${arch}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" .
            (cd dist && tar czf "recur_${os}_${arch}.tar.gz" "recur_${os}_${arch}" && rm "recur_${os}_${arch}")
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
